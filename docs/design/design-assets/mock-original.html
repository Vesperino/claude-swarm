<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='white'/><rect width='100' height='100' fill='black' rx='20' style='mix-blend-mode:destination-over'/></svg>">
<!--
  Swarm Board — static design mock (single file, no external requests).
  JS contract selectors are all present and unchanged:
    #goal #round #status #filterPill #filterName #filterClear
    #feed .entry[data-role][data-from] .time .from .body .type .text .refchip[data-ref]
    #agents .agent[data-id] (b, .role, .task) · #tree .grp a[data-scope][data-file] .empty
    #viewer(.open) .vhead #vpath #vclose #vbody · #agstream .act.(tool|text|result|info)
    #msg #send #stopBtn #acceptBtn #mention [data-m] · .wikilink[data-wl]
  Mock-only additions (safe to keep or replace when merging the live layer):
    #jumpPill, #confirmWrap, .entry.phase (divider styling for round/final),
    .morebtn (collapse affordance), .model (model badge), sample data + mock handlers at the
    bottom of the script (section marked MOCK DATA / MOCK WIRING).
-->
<style>
  :root {
    --bg:#000; --panel:#0a0a0a; --panel2:#111; --hover:#0f0f0f;
    --border:#262626; --border2:#333; --border3:#525252;
    --text:#ededed; --soft:#d4d4d4; --dim:#a1a1a1; --faint:#666; --ghost:#525252;
    --judge:#f5a623; --worker:#52a9ff; --critic:#ff6480; --human:#2fd180; --system:#888;
    --blue:#52a9ff; --red:#e5484d; --red-t:#ff6166; --green:#2fd180; --amber:#f5a623;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--text); font:14px/1.5 var(--sans);
    display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:1fr 296px;
    grid-template-areas:"header header" "feed side" "footer footer"; height:100vh;
  }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:5px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-track { background:transparent; }
  button { font:inherit; }
  :is(button,a,input,[tabindex]):focus-visible { outline:2px solid var(--faint); outline-offset:2px; border-radius:6px; }

  /* ---------- header ---------- */
  header { grid-area:header; display:flex; align-items:center; gap:14px;
    padding:0 20px; height:56px; background:var(--bg); border-bottom:1px solid var(--border); }
  header h1 { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; color:#fff; white-space:nowrap; }
  header h1::before { content:""; width:8px; height:8px; border-radius:999px; background:#fff; }
  header h1 small { color:var(--faint); font-weight:400; font-size:14px; }
  .hsep { color:var(--border2); }
  #goal { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; font-size:13px; }
  .pill { font:12px var(--mono); padding:3px 12px; border-radius:999px;
    border:1px solid var(--border2); color:var(--dim); white-space:nowrap; }
  #status { display:inline-flex; align-items:center; gap:7px; color:var(--text); }
  #status::before { content:""; width:7px; height:7px; border-radius:999px; background:var(--faint); }
  #status.running::before { background:var(--green); }
  #status.done::before { background:var(--blue); }
  #status.accepted::before { background:var(--amber); }
  #status.stopped::before { background:var(--critic); }
  #status.failed { background:var(--red); border-color:var(--red); color:#fff; }
  #status.failed::before { background:#fff; }
  #status.error { color:var(--red-t); border-style:dashed; border-color:rgba(229,72,77,.55); }
  #status.error::before { background:var(--red-t); }
  @media (prefers-reduced-motion: no-preference) {
    #status.running::before { animation:pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity:.25; } }
  }
  #filterPill { display:none; align-items:center; gap:7px; color:var(--text); padding-right:6px; }
  #filterPill.on { display:inline-flex; }
  #filterName { font-weight:600; }
  #filterClear { cursor:pointer; width:16px; height:16px; border-radius:999px; background:#1f1f1f;
    display:inline-flex; align-items:center; justify-content:center; font-size:10px; color:var(--dim); }
  #filterClear:hover { background:var(--border2); color:#fff; }

  /* ---------- feed ---------- */
  #feedwrap { grid-area:feed; position:relative; min-width:0; }
  #feed { position:absolute; inset:0; overflow-y:auto; padding:14px 20px 24px;
    display:grid; grid-template-columns:max-content max-content 1fr; gap:0 18px;
    align-content:start; font:12.5px/1.6 var(--mono); }
  .entry { grid-column:1/-1; display:grid; grid-template-columns:subgrid;
    padding:6px 10px; border-radius:6px; border:1px solid transparent; }
  .entry:hover { background:var(--hover); }
  .entry .time { color:var(--faint); font-size:11.5px; padding-top:1px; }
  .entry .from { font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; }
  .entry .from:hover { text-decoration:underline; text-underline-offset:3px; }
  .entry[data-role=judge]  .from { color:var(--judge); }
  .entry[data-role=worker] .from { color:var(--worker); }
  .entry[data-role=critic] .from { color:var(--critic); }
  .entry[data-role=human]  .from { color:var(--human); }
  .entry[data-role=system] .from { color:var(--system); }
  .entry[data-role=human] { background:rgba(47,209,128,.05); }
  .entry.learning { background:rgba(47,209,128,.04); border-color:rgba(47,209,128,.3); }
  .entry .body { min-width:0; display:grid; grid-template-columns:max-content 1fr; gap:0 10px; }
  .entry .type { color:var(--dim); font:500 10px/1.5 var(--sans); letter-spacing:.04em;
    border:1px solid var(--border2); border-radius:999px; padding:1px 8px; height:fit-content; white-space:nowrap; }
  .entry .type.learning { color:var(--human); border-color:rgba(47,209,128,.4); }
  .entry .text { display:block; color:var(--soft); white-space:pre-wrap; word-break:break-word; }
  .entry .text.clamp { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .morebtn { margin-top:4px; color:var(--faint); font:11.5px var(--sans); cursor:pointer; width:fit-content; }
  .morebtn:hover { color:var(--text); }
  .refs { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .refchip { font-size:11px; color:var(--text); background:var(--panel); border:1px solid var(--border2);
    border-radius:6px; padding:2.5px 9px; cursor:pointer; display:inline-flex; gap:7px; align-items:center; }
  .refchip::before { content:"▤"; color:var(--faint); }
  .refchip:hover { border-color:var(--faint); background:var(--panel2); }
  code { background:#1a1a1a; border:1px solid var(--border); border-radius:4px; padding:0 4px; font-size:.92em; font-family:var(--mono); }
  .mention { color:#fff; font-weight:600; }
  .wikilink { color:var(--blue); text-decoration:underline dotted; text-underline-offset:3px; cursor:pointer; }
  /* phase dividers: round / final entries */
  .entry.phase { display:flex; align-items:center; gap:12px; margin:16px 0 8px; padding:0 10px; border:none; background:none; }
  .entry.phase:hover { background:none; }
  .entry.phase .time { flex:none; }
  .entry.phase .from { font-size:11.5px; color:var(--dim) !important; flex:none; }
  .entry.phase .body { display:inline-flex; align-items:center; gap:10px; min-width:0; }
  .entry.phase .type { color:var(--amber); border-color:rgba(245,166,35,.4); text-transform:uppercase; letter-spacing:.08em; }
  .entry.phase .text { color:var(--text); font:600 12px var(--sans); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry.phase::after { content:""; flex:1; border-top:1px solid var(--border); }
  #jumpPill { position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    font:600 12px var(--sans); color:var(--text); background:#1a1a1a; border:1px solid var(--border2);
    border-radius:999px; padding:6px 16px; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.7); z-index:3; display:none; }
  #jumpPill:hover { background:var(--border); border-color:var(--border3); }
  #jumpPill.on { display:block; }

  /* ---------- sidebar ---------- */
  aside { grid-area:side; background:var(--bg); border-left:1px solid var(--border);
    overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:20px; }
  aside h2 { font:500 11px var(--sans); letter-spacing:.06em; color:var(--faint); text-transform:uppercase; }
  .shead { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .count { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim);
    border:1px solid var(--border2); border-radius:999px; padding:1px 9px; }
  .count::before { content:""; width:6px; height:6px; border-radius:999px; background:var(--green); }
  @media (prefers-reduced-motion: no-preference) { .count::before { animation:pulse 1.6s infinite; } }
  #agents { display:flex; flex-direction:column; gap:6px; }
  .agent { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:9px 11px; cursor:pointer; }
  .agent:hover { border-color:var(--border3); }
  .agent .arow { display:flex; align-items:center; gap:8px; font:12px var(--mono); }
  .agent b { font-weight:600; }
  .agent[data-role=worker] b { color:var(--worker); } .agent[data-role=critic] b { color:var(--critic); }
  .agent .role { color:var(--faint); font-size:10.5px; }
  .agent .model { margin-left:auto; font:10px var(--sans); color:var(--dim); background:var(--bg);
    border:1px solid var(--border2); border-radius:5px; padding:1px 6px; }
  .agent .trow { display:flex; gap:8px; align-items:baseline; margin-top:4px; }
  .agent .task { color:var(--dim); font:11.5px var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .agent .live { color:var(--faint); font-size:10px; flex:none; }
  .agent.none { cursor:default; border-style:dashed; text-align:center; color:var(--faint); font:11.5px var(--sans); line-height:1.6; }
  .agent.none:hover { border-color:var(--border); }
  #tree { font:12px var(--mono); display:flex; flex-direction:column; gap:1px; }
  #tree .grp { color:var(--faint); font:500 10.5px var(--sans); margin:10px 0 3px; text-transform:uppercase; letter-spacing:.06em; }
  #tree .grp:first-child { margin-top:0; }
  #tree .fold { color:var(--dim); padding:3px 8px 1px; }
  #tree .fold::before { content:"▾ "; color:var(--ghost); }
  #tree a { display:block; color:var(--soft); text-decoration:none; padding:3px 8px; border-radius:6px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #tree a::before { content:"▤ "; color:var(--ghost); }
  #tree a.sub { padding-left:26px; }
  #tree a:hover { background:var(--hover); color:#fff; }
  #tree .empty { display:block; background:var(--panel); border:1px dashed var(--border2); border-radius:8px;
    padding:13px; text-align:center; color:var(--faint); font:11.5px/1.6 var(--sans); font-style:normal; margin-top:2px; }

  /* ---------- viewer ---------- */
  #viewer { position:fixed; inset:0 0 0 auto; width:min(680px,90vw); background:var(--panel);
    border-left:1px solid var(--border); box-shadow:-16px 0 50px rgba(0,0,0,.7);
    overflow-y:auto; z-index:10; padding:0 24px 22px; display:none; }
  #viewer.open { display:block; }
  #viewer .vhead { position:sticky; top:0; background:var(--panel); z-index:2;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:16px 0 12px; margin-bottom:14px; border-bottom:1px solid var(--border); }
  #vpath { font:12px var(--mono); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #vclose { background:none; border:1px solid var(--border2); color:var(--dim); border-radius:6px;
    padding:4px 12px; cursor:pointer; font-size:12px; }
  #vclose:hover { border-color:var(--faint); color:#fff; }
  #vbody { font-size:13.5px; line-height:1.75; color:var(--soft); max-width:600px; }
  #vbody h1 { margin:10px 0 12px; font-size:22px; font-weight:650; color:#fff; letter-spacing:-.02em; }
  #vbody h2 { margin:24px 0 8px; font-size:16px; font-weight:650; color:#fff; letter-spacing:-.01em; }
  #vbody h3 { margin:18px 0 6px; font-size:14px; font-weight:650; color:#fff; }
  #vbody p, #vbody ul, #vbody pre { margin:10px 0; }
  #vbody li { margin:4px 0 4px 22px; }
  #vbody pre { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:14px 16px;
    overflow-x:auto; font:12px/1.6 var(--mono); color:var(--soft); }
  #vbody .agtask { color:var(--dim); font-size:12.5px; font-style:normal; margin:2px 0 12px; }
  #agstream { display:flex; flex-direction:column; gap:3px; font:12px/1.55 var(--mono); }
  #agstream .act { display:grid; grid-template-columns:2px max-content 1fr; gap:11px;
    padding:4px 10px 4px 6px; border-radius:6px; word-break:break-word; }
  #agstream .act::before { content:""; background:var(--border2); border-radius:2px; opacity:.8; }
  #agstream .act b { font-weight:600; white-space:nowrap; color:var(--dim); }
  #agstream .act span { color:var(--dim); min-width:0; }
  #agstream .act.tool::before { background:var(--blue); } #agstream .act.tool b { color:var(--blue); }
  #agstream .act.tool span { color:var(--soft); }
  #agstream .act.text { background:var(--hover); } #agstream .act.text::before { background:var(--soft); }
  #agstream .act.text b, #agstream .act.text span { color:var(--soft); }
  #agstream .act.info { background:rgba(245,166,35,.06); }
  #agstream .act.info::before { background:var(--amber); }
  #agstream .act.info b, #agstream .act.info span { color:var(--amber); }

  /* ---------- composer ---------- */
  footer { grid-area:footer; position:relative; display:flex; gap:10px; padding:14px 20px;
    background:var(--bg); border-top:1px solid var(--border); align-items:stretch; }
  .msgwrap { flex:1; display:flex; align-items:center; gap:10px; border:1px solid var(--border2);
    background:var(--panel); border-radius:8px; padding:0 14px; }
  .msgwrap:focus-within { border-color:var(--faint); }
  #msg { flex:1; background:none; border:none; outline:none; color:var(--text);
    font:12.5px var(--mono); height:38px; }
  #msg::placeholder { color:var(--ghost); }
  .kbd { color:var(--ghost); font-size:10.5px; border:1px solid var(--border2); border-radius:4px; padding:1px 6px; flex:none; }
  footer button { border-radius:8px; padding:0 20px; font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; }
  #send { background:#1a1a1a; color:var(--text); border:1px solid var(--border2); padding:0 22px; }
  #send:hover { background:var(--border); border-color:var(--border3); }
  .vr { width:1px; background:var(--border); margin:3px 6px; }
  #stopBtn { background:none; border:1px solid rgba(229,72,77,.55); color:var(--red-t); }
  #stopBtn:hover:not(:disabled) { background:rgba(229,72,77,.12); }
  #stopBtn i { font-style:normal; font-size:10px; }
  #acceptBtn { background:none; border:1px solid rgba(47,209,128,.5); color:var(--green); }
  #acceptBtn:hover:not(:disabled) { background:rgba(47,209,128,.1); }
  footer button:disabled { opacity:.35; cursor:default; }
  #mention { position:absolute; bottom:66px; left:20px; background:var(--panel); border:1px solid var(--border2);
    border-radius:10px; box-shadow:0 -10px 36px rgba(0,0,0,.8); overflow:hidden; z-index:20;
    min-width:230px; padding:5px; display:none; }
  #mention div { padding:6px 12px; border-radius:6px; cursor:pointer; font:12.5px var(--mono);
    display:flex; justify-content:space-between; gap:16px; }
  #mention div::after { content:"↵"; color:var(--faint); font-size:10.5px; }
  #mention div:hover, #mention div.sel { background:#1f1f1f; }
  #mention div[data-m=all], #mention div[data-m=HUMAN] { color:#fff; }
  #mention div[data-m=judge] { color:var(--judge); }
  #mention div.worker { color:var(--worker); } #mention div.critic { color:var(--critic); }

  /* ---------- confirm (mock) ---------- */
  #confirmWrap { position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
    z-index:30; display:none; align-items:center; justify-content:center; }
  #confirmWrap.on { display:flex; }
  .cbox { background:var(--panel); border:1px solid var(--border2); border-radius:12px;
    padding:20px 22px; width:380px; box-shadow:0 24px 70px rgba(0,0,0,.9); }
  .cbox h3 { color:#fff; font-weight:600; font-size:15px; }
  .cbox p { color:var(--dim); font-size:13px; margin:8px 0 16px; line-height:1.55; }
  .cbtns { display:flex; gap:8px; justify-content:flex-end; font-size:13px; }
  .cbtns button { border-radius:8px; padding:7px 15px; cursor:pointer; font-size:13px; }
  .ccancel { background:none; color:var(--text); border:1px solid var(--border2); font-weight:500; }
  .ccancel:hover { border-color:var(--faint); }
  .cstop { color:#fff; background:var(--red); border:none; font-weight:600; }
  .cstop:hover { background:#f2555a; }
  .caccept { color:#000; background:var(--green); border:none; font-weight:600; }
  .caccept:hover { background:#4adb92; }

  @media (max-width:1100px) { body { grid-template-columns:1fr 250px; } }
</style>
</head>
<body>
<header>
  <h1>Swarm <small>Board</small></h1>
  <span class="hsep">/</span>
  <span id="goal" title=""></span>
  <span class="pill" id="filterPill">filter: <b id="filterName"></b> <span id="filterClear">×</span></span>
  <span class="pill" id="round">round —</span>
  <span class="pill" id="status">connecting</span>
</header>

<div id="feedwrap">
  <div id="feed" aria-live="polite"></div>
  <div id="jumpPill">↓ new messages</div>
</div>

<aside>
  <section>
    <div class="shead"><h2>Agents</h2><span class="count" id="agentCount">0 live</span></div>
    <div id="agents"></div>
  </section>
  <section>
    <div class="shead"><h2>Wiki</h2></div>
    <div id="tree"></div>
  </section>
</aside>

<div id="viewer">
  <div class="vhead"><code id="vpath"></code><button id="vclose">Close ⎋</button></div>
  <div id="vbody"></div>
</div>

<footer>
  <div id="mention"></div>
  <div class="msgwrap">
    <input id="msg" placeholder="Message the swarm as HUMAN — @ to address an agent, Enter to send" aria-label="Message to the swarm" autocomplete="off">
    <span class="kbd">↵</span>
  </div>
  <button id="send">Post</button>
  <div class="vr"></div>
  <button id="stopBtn"><i>■</i>Stop run</button>
  <button id="acceptBtn"><i>✓</i>Accept result</button>
</footer>

<div id="confirmWrap"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const feed = $('feed');
let filterFrom = null;
const seenFrom = new Set(['all', 'judge', 'HUMAN']);

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Inline formatting: `code`, **bold**, @mentions, [[wiki links]].
function fmtInline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|\s)@([\w-]+)/g, '$1<span class="mention">@$2</span>')
    .replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink" data-wl="$1">[[$1]]</span>');
}

// Tiny markdown renderer for the wiki viewer.
function renderMd(src) {
  const out = [];
  const lines = src.split(/\r?\n/);
  let inCode = false, buf = [];
  const flushP = () => { if (buf.length) { out.push('<p>' + fmtInline(buf.join(' ')) + '</p>'); buf = []; } };
  for (const line of lines) {
    if (line.startsWith('```')) { flushP(); out.push(inCode ? '</pre>' : '<pre>'); inCode = !inCode; continue; }
    if (inCode) { out.push(esc(line) + '\n'); continue; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { flushP(); out.push(`<h${h[1].length}>` + fmtInline(h[2]) + `</h${h[1].length}>`); continue; }
    if (/^\s*[-*]\s+/.test(line)) { flushP(); out.push('<li>' + fmtInline(line.replace(/^\s*[-*]\s+/, '')) + '</li>'); continue; }
    if (!line.trim()) { flushP(); continue; }
    buf.push(line);
  }
  flushP(); if (inCode) out.push('</pre>');
  return out.join('');
}

function entryMatchesFilter(el) {
  return !filterFrom || el.classList.contains('phase') ||
    el.dataset.from === filterFrom || el.textContent.includes('@' + filterFrom) || el.textContent.includes('@all');
}
function applyFilter() {
  document.querySelectorAll('.entry').forEach(el => { el.style.display = entryMatchesFilter(el) ? '' : 'none'; });
  $('filterPill').classList.toggle('on', !!filterFrom);
  if (filterFrom) $('filterName').textContent = filterFrom;
}
function setFilter(name) {
  filterFrom = filterFrom === name ? null : name;
  applyFilter();
  if (!filterFrom) feed.scrollTop = feed.scrollHeight;
}
$('filterClear').onclick = () => { filterFrom = null; applyFilter(); };

function nearBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80; }
feed.addEventListener('scroll', () => $('jumpPill').classList.toggle('on', !nearBottom()));
$('jumpPill').onclick = () => { feed.scrollTop = feed.scrollHeight; $('jumpPill').classList.remove('on'); };

function addEntry(m) {
  const stick = nearBottom();
  const el = document.createElement('div');
  el.className = 'entry';
  el.dataset.role = m.role || 'system';
  el.dataset.from = m.from || '';
  if (m.from) seenFrom.add(m.from);
  const phase = m.type === 'round' || m.type === 'final';
  if (phase) el.classList.add('phase');
  if (m.type === 'learning') el.classList.add('learning');
  const refs = (m.refs || []).map(r => `<span class="refchip" data-ref="${esc(r)}">${esc(r)}</span>`).join('');
  const lines = String(m.text || '').split('\n');
  const long = !phase && lines.length > 5;
  el.innerHTML =
    `<span class="time">${esc((m.ts || '').slice(11, 19))}</span>` +
    `<span class="from">${esc(m.from || '?')}</span>` +
    `<div class="body"><span class="type ${esc(m.type || 'msg')}">${esc(m.type || 'msg')}</span>` +
    `<div style="min-width:0"><span class="text${long ? ' clamp' : ''}">${fmtInline(m.text)}</span>` +
    (long ? `<div class="morebtn">Show ${lines.length - 4} more lines</div>` : '') +
    (refs ? `<div class="refs">${refs}</div>` : '') + `</div></div>`;
  if (!entryMatchesFilter(el)) el.style.display = 'none';
  feed.appendChild(el);
  if (stick) feed.scrollTop = feed.scrollHeight;
  else $('jumpPill').classList.add('on');
}

  $('goal').textContent = s.goal || '';

function renderTree(t) {
  const link = (scope, f, sub) =>
    `<a href="#" class="${sub ? 'sub' : ''}" data-scope="${scope}" data-file="${esc(f)}">${esc(f.split('/').pop())}</a>`;
  const group = (name, scope, files) => {
    // folder-style grouping for path-like names
    const flat = [], folders = {};
    (files || []).forEach(f => {
      const i = f.indexOf('/');
      if (i < 0) flat.push(f); else (folders[f.slice(0, i + 1)] = folders[f.slice(0, i + 1)] || []).push(f);
    });
    let html = `<div class="grp">${name}</div>`;
    flat.forEach(f => html += link(scope, f));
    for (const dir of Object.keys(folders).sort()) {
      html += `<div class="fold">${esc(dir)}</div>`;
      folders[dir].forEach(f => html += link(scope, f, true));
    }
    if (!(files || []).length) html += '<span class="empty">Nothing published yet.<br>Agents write cross-run notes here.</span>';
    return html;
  };
  $('tree').innerHTML =
    group('run wiki', 'run', t.run) + group('artifacts', 'artifacts', t.artifacts) + group('global wiki', 'global', t.global);
}

function openWiki(scope, file) {
  $('vpath').textContent = scope + ':' + file;

  $('viewer').classList.add('open');
}

document.addEventListener('click', e => {
  const ag = e.target.closest('#agents .agent');
  if (ag && ag.dataset.id) { const a = AGENTS.find(x => x.id === ag.dataset.id); if (a) openAgentView(a); return; }
  const fr = e.target.closest('.entry .from');
  if (fr && !fr.closest('.phase')) { setFilter(fr.textContent); return; }
  const more = e.target.closest('.morebtn');
  if (more) {
    const txt = more.parentElement.querySelector('.text');
    if (!more.dataset.label) more.dataset.label = more.textContent;
    const clamped = txt.classList.toggle('clamp');
    more.textContent = clamped ? more.dataset.label : 'Show less';
    return;
  }
  const ref = e.target.closest('[data-ref]');
  if (ref) { const r = ref.dataset.ref;
    if (r.startsWith('global:')) openWiki('global', r.slice(7));
    else if (r.startsWith('artifacts/')) openWiki('artifacts', r.slice(10));
    else openWiki('run', r.replace(/^wiki\//, ''));
    return; }
  const tl = e.target.closest('#tree a');
  if (tl) { e.preventDefault(); openWiki(tl.dataset.scope, tl.dataset.file); return; }
  const wl = e.target.closest('.wikilink');
  if (wl) { const hit = WLMAP[wl.dataset.wl.toLowerCase()]; if (hit) openWiki(hit[0], hit[1]); }
});

Native \`URLPattern\` is the WHATWG standard pattern matcher — flag-free since Node 23, behind \`--experimental-urlpattern\` on 22. It matches path, search and hash in one object and returns named groups directly.

Construction dominates: each pattern compiles to an internal regex set. Measured on the 1k-route corpus:

cold p50 (first hit)      warm p50 (cached)

- Groups API is the ergonomic win: no manual capture-index bookkeeping.

**Recommendation:** compiled-regex table by default; switch to a radix-trie past ~500 routes; adopt native \`URLPattern\` once Node 23+ is your floor.

## The three approaches

- Compiled regex table — ~30 lines, warm p50 2.1µs at 1k routes; O(n) scan. [[regex-table]]
- Radix trie — ~120 lines, p50 0.9µs flat; crossover vs regex at ~500 routes. [[trie-router]]
- Native URLPattern — ~15 lines, WHATWG semantics; compile cost demands module-scope caching. [[urlpattern-routing]]

## Evidence

Full matrix in [[comparison-matrix]]. Cold-start numbers were re-run per critic-1 with a fresh process per case.

## Caveats
